<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>灯火会宁 · 长征胜利90周年剧本杀</title>
<style>
:root{
  --ink:#0b1220; --ink2:#101a2e; --ink3:#16223a;
  --paper:#e9dcc3; --paper-dim:#c9b998;
  --lamp:#f0b84e; --lamp-hi:#ffd98a;
  --red:#a83232; --red-hi:#c9503f;
  --line:rgba(240,184,78,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(120% 90% at 50% 0%, #16223a 0%, var(--ink) 60%, #060a14 100%);
  color:var(--paper);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  min-height:100vh; line-height:1.75;
}
#snow{position:fixed; inset:0; z-index:60; pointer-events:none;}
#app{max-width:620px; margin:0 auto; padding:18px 16px 90px; position:relative; z-index:2;}
.screen{animation:fadein .6s ease both;}
@keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
h1,h2,h3{font-weight:700; letter-spacing:.12em;}
.center{text-align:center;}
.dim{color:var(--paper-dim);}
.red{color:var(--red-hi);}
.lampc{color:var(--lamp);}
.small{font-size:.85em;}
.hr{border:none; border-top:1px solid var(--line); margin:22px 0;}

/* 标题页 */
.title-wrap{text-align:center; padding:52px 0 30px; position:relative;}
.game-title{
  font-size:3.2em; margin:.2em 0; letter-spacing:.28em; text-indent:.28em;
  color:var(--lamp-hi);
  text-shadow:0 0 18px rgba(240,184,78,.55), 0 0 60px rgba(240,184,78,.25);
  animation:lampglow 3.2s ease-in-out infinite;
}
@keyframes lampglow{
  0%,100%{text-shadow:0 0 14px rgba(240,184,78,.45),0 0 46px rgba(240,184,78,.18);}
  50%{text-shadow:0 0 24px rgba(255,217,138,.75),0 0 80px rgba(240,184,78,.35);}
}
.subtitle{color:var(--paper-dim); letter-spacing:.3em; font-size:.95em;}
.lamp-flame{
  width:14px; height:22px; margin:26px auto 0; border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%, #fff3c4 0%, var(--lamp) 45%, #d07a1e 80%, transparent 100%);
  filter:blur(.4px); transform-origin:50% 100%;
  animation:flick .5s ease-in-out infinite alternate;
  box-shadow:0 0 30px 12px rgba(240,184,78,.35);
}
@keyframes flick{from{transform:scaleY(1) scaleX(1);} to{transform:scaleY(1.15) scaleX(.92) translateY(-1px);}}

/* 按钮 */
.btn{
  display:block; width:100%; margin:12px 0; padding:13px 18px;
  background:linear-gradient(180deg, rgba(240,184,78,.10), rgba(240,184,78,.04));
  border:1px solid var(--line); border-radius:8px; color:var(--lamp-hi);
  font-family:inherit; font-size:1.02em; letter-spacing:.15em; cursor:pointer;
  transition:all .2s;
}
.btn:hover:not(:disabled){background:rgba(240,184,78,.18); border-color:var(--lamp);}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn.red-btn{border-color:rgba(200,80,63,.6); color:#e8a79d;}
.btn.ghost{background:transparent;}
.opt-btn{
  display:block; width:100%; margin:8px 0; padding:11px 14px; text-align:left;
  background:rgba(255,255,255,.04); border:1px solid rgba(233,220,195,.18);
  border-radius:8px; color:var(--paper); font-family:inherit; font-size:.98em; cursor:pointer;
}
.opt-btn:hover{border-color:var(--lamp); background:rgba(240,184,78,.10);}
.opt-btn.sel{border-color:var(--lamp); background:rgba(240,184,78,.16); box-shadow:0 0 0 1px var(--lamp) inset;}

/* 旁白 / 打字机 */
.narr{
  background:rgba(11,18,32,.72); border:1px solid rgba(233,220,195,.14);
  border-left:3px solid var(--lamp); border-radius:6px;
  padding:16px 18px; margin:14px 0; min-height:60px;
}
.narr p{margin:.4em 0;}
.narr p:first-child{margin-top:0;} .narr p:last-child{margin-bottom:0;}
.cursor::after{content:"▍"; color:var(--lamp); animation:blink .8s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
.dm-tag{display:inline-block; font-size:.75em; letter-spacing:.25em; color:var(--ink);
  background:var(--lamp); border-radius:3px; padding:1px 8px; margin-bottom:8px;}
.skiptip{text-align:center; color:var(--paper-dim); font-size:.8em; margin-top:6px;}

/* 角色卡 */
.char-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0;}
.char-card{
  border:1px solid rgba(233,220,195,.2); border-radius:10px; padding:14px 12px;
  background:linear-gradient(160deg, rgba(22,34,58,.9), rgba(11,18,32,.9));
  cursor:pointer; transition:all .2s;
}
.char-card:hover{border-color:var(--lamp); transform:translateY(-2px);}
.char-card .cname{font-size:1.25em; color:var(--lamp-hi); letter-spacing:.1em;}
.char-card .crole{color:var(--red-hi); font-size:.85em; margin:2px 0 6px;}
.char-card .cdesc{font-size:.82em; color:var(--paper-dim); line-height:1.6;}
.char-card.sel{border-color:var(--lamp); box-shadow:0 0 18px rgba(240,184,78,.25);}

/* 手记 / 面板 */
.overlay{
  position:fixed; inset:0; z-index:80; background:rgba(4,7,14,.82);
  display:flex; align-items:flex-end; justify-content:center;
}
.panel{
  width:100%; max-width:620px; max-height:84vh; overflow-y:auto;
  background:linear-gradient(180deg,#17233c,#0d1526);
  border:1px solid var(--line); border-bottom:none; border-radius:14px 14px 0 0;
  padding:18px 18px 30px;
}
.panel h3{margin-top:0; color:var(--lamp-hi);}
.tabs{display:flex; gap:8px; margin-bottom:12px;}
.tab{flex:1; text-align:center; padding:8px; border:1px solid rgba(233,220,195,.2);
  border-radius:6px; cursor:pointer; color:var(--paper-dim); font-size:.95em;}
.tab.on{border-color:var(--lamp); color:var(--lamp-hi); background:rgba(240,184,78,.10);}
.memo-item{margin:10px 0; padding:10px 12px; background:rgba(255,255,255,.04);
  border-left:2px solid var(--red); border-radius:4px; font-size:.95em;}
.task-item{margin:10px 0; padding:10px 12px; background:rgba(255,255,255,.04); border-radius:4px;}
.task-item .tick{color:var(--lamp); font-weight:bold; margin-right:6px;}

/* 顶栏工具 */
#hud{position:fixed; left:0; right:0; bottom:0; z-index:70; display:none;
  background:rgba(8,12,22,.92); border-top:1px solid var(--line);
  padding:8px 10px; backdrop-filter:blur(4px);}
#hud .row{max-width:620px; margin:0 auto; display:flex; gap:8px;}
#hud button{flex:1; padding:9px 4px; background:rgba(240,184,78,.08); color:var(--lamp-hi);
  border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:.88em; cursor:pointer;}
#sndbtn{position:fixed; top:10px; right:12px; z-index:70; background:rgba(8,12,22,.8);
  border:1px solid var(--line); color:var(--lamp-hi); border-radius:6px; padding:6px 10px;
  font-family:inherit; cursor:pointer; display:none;}

/* 搜证 */
.map-box{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#0d1730;}
svg text{fill:var(--paper); font-family:inherit;}
.hot{fill:rgba(240,184,78,.14); stroke:var(--line); stroke-width:1.2; cursor:pointer; transition:all .2s;}
.hot:hover{fill:rgba(240,184,78,.30);}
.hot.glow{stroke:var(--lamp); animation:hotpulse 1.4s ease-in-out infinite;}
@keyframes hotpulse{0%,100%{fill:rgba(240,184,78,.14);} 50%{fill:rgba(240,184,78,.34);}}
.hot.done{fill:rgba(120,120,120,.10); stroke:rgba(233,220,195,.12);}
.spot-btn{display:block; width:100%; margin:8px 0; padding:12px; text-align:left;
  background:rgba(255,255,255,.05); border:1px solid rgba(233,220,195,.18); border-radius:8px;
  color:var(--paper); font-family:inherit; font-size:1em; cursor:pointer;}
.spot-btn:hover:not(:disabled){border-color:var(--lamp);}
.spot-btn:disabled{opacity:.4; cursor:default;}
.spot-btn .got{color:var(--lamp); float:right;}

/* 线索卡 */
.clue-card{
  border:1px solid var(--lamp); border-radius:10px; padding:18px 16px; margin:14px 0;
  background:linear-gradient(170deg,#1a2742,#101a2e);
  box-shadow:0 6px 26px rgba(0,0,0,.5); position:relative;
}
.clue-card .cid{position:absolute; top:-11px; left:14px; background:var(--red); color:#fff;
  font-size:.8em; letter-spacing:.2em; padding:2px 10px; border-radius:3px;}
.clue-card .ct{color:var(--lamp-hi); font-size:1.15em; letter-spacing:.08em; margin:4px 0 10px;}
.clue-card .cx{font-size:.96em; line-height:1.9;}
.clue-mini{margin:8px 0; padding:9px 12px; background:rgba(255,255,255,.04);
  border-left:2px solid var(--lamp); border-radius:4px; font-size:.9em; cursor:pointer;}
.clue-mini .hidetag{color:var(--red-hi); font-size:.8em; margin-left:6px;}

/* 讨论 */
.say{margin:14px 0; padding:12px 14px; border-radius:8px; background:rgba(255,255,255,.045);
  border:1px solid rgba(233,220,195,.12); animation:fadein .4s ease both;}
.say .who{color:var(--lamp-hi); letter-spacing:.1em; margin-bottom:4px; font-size:.95em;}
.say .who .wrole{color:var(--paper-dim); font-size:.8em; margin-left:8px;}
.say.me{border-color:rgba(200,80,63,.5);}
.say.dm-say{background:rgba(240,184,78,.06); border-left:3px solid var(--lamp);}
.mono{font-style:italic; color:var(--paper-dim);}

/* 送信 */
#letter{width:100%; min-height:64px; resize:none; padding:12px; font-size:1.1em;
  font-family:inherit; color:var(--ink); background:linear-gradient(180deg,#e9dcc3,#dccbA6);
  border:none; border-radius:6px; letter-spacing:.1em;}
.counter{text-align:right; font-size:.8em; color:var(--paper-dim);}

/* 投票 */
.vote-q{margin:18px 0; padding:14px; border:1px solid rgba(233,220,195,.14); border-radius:10px;}
.vote-q .qt{color:var(--lamp-hi); letter-spacing:.08em; margin-bottom:8px;}

/* 复盘 */
.reveal-title{text-align:center; font-size:1.6em; color:var(--lamp-hi); letter-spacing:.3em;
  margin:26px 0 6px;}
.reveal-sub{text-align:center; color:var(--red-hi); letter-spacing:.2em; margin-bottom:18px;}
.chain{margin:10px 0; padding:10px 12px; background:rgba(168,50,50,.10);
  border-left:2px solid var(--red); border-radius:4px; font-size:.93em;}

/* 结算 */
.result-banner{text-align:center; padding:18px; margin:16px 0; border-radius:10px;
  border:1px solid var(--lamp); background:rgba(240,184,78,.08);}
.result-banner.bad{border-color:var(--red); background:rgba(168,50,50,.10);}
.result-banner .big{font-size:1.5em; letter-spacing:.2em; margin:6px 0;}

/* 彩蛋 */
#egg-lamps{display:flex; justify-content:center; gap:18px; margin:36px 0;}
.egg-lamp{width:10px; height:16px; border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:#333; transition:all 1.6s ease;}
.egg-lamp.lit{background:radial-gradient(circle at 50% 70%, #fff3c4, var(--lamp) 55%, #d07a1e);
  box-shadow:0 0 26px 8px rgba(240,184,78,.4);}
.egg-line{opacity:0; transform:translateY(8px); transition:opacity 2.4s ease, transform 2.4s ease;
  margin:1.1em 0; text-align:center;}
.egg-line.show{opacity:1; transform:none;}
.egg-final{font-size:1.4em; color:var(--lamp-hi); letter-spacing:.2em;
  text-shadow:0 0 20px rgba(240,184,78,.5);}

.badge{display:inline-block; font-size:.72em; border:1px solid var(--line); border-radius:3px;
  padding:0 6px; color:var(--paper-dim); margin-left:6px;}

/* 音频面板 / 提示条 */
#toast{position:fixed; top:52px; left:50%; transform:translateX(-50%) translateY(-8px); z-index:90;
  background:rgba(20,28,46,.95); border:1px solid var(--lamp); color:var(--lamp-hi);
  padding:8px 18px; border-radius:20px; font-size:.9em; letter-spacing:.1em;
  opacity:0; pointer-events:none; transition:all .35s ease;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.vol-row{display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin:12px 0; padding:10px 12px; background:rgba(255,255,255,.04); border-radius:8px;}
.vol-row span{letter-spacing:.06em;}
.opt-btn.sw{width:auto; margin:0; padding:6px 18px; text-align:center; letter-spacing:.2em;}
.opt-btn.sw.on{border-color:var(--lamp); color:var(--lamp-hi); background:rgba(240,184,78,.14);}
#volslider{flex:1; accent-color:var(--lamp); height:4px;}
@media (min-width:640px){ .game-title{font-size:3.8em;} }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<button id="sndbtn" onclick="AudioUI.panel()">🔊 音频</button>
<div id="toast"></div>
<div id="app"></div>
<div id="hud"><div class="row">
  <button onclick="UI.memo()">📖 随身手记</button>
  <button onclick="UI.bag()">🎒 证据袋</button>
  <button onclick="UI.save2title()">💾 存回标题</button>
</div></div>
<div id="ovl" style="display:none"></div>
<script>
/* =====================================================================
   《灯火会宁》单机沉浸版 · 数据层
   ===================================================================== */
var DATA = {};

DATA.intro = [
 "1936年10月7日深夜，甘肃会宁县城外三十里，老君坡驿站。",
 "三天前，红一方面军先遣队秘密进驻此地，为即将到来的三军会师做最后的联络准备。驿站里住着七个人：指战员、宣传队员、卫生员、向导，还有一位从西安千里迢迢赶来的战地记者。",
 "今夜，一封关乎会师路线的绝密电文刚刚送达。电文锁在参谋老周随身的铁匣里——里面有敌军布防图、会师地点的备用方案，以及一份潜伏在我方内部的可疑人员名单。",
 "午夜时分，一声枪响。",
 "老周被发现死在自己的房间里，铁匣大开，电文不翼而飞。门外大雪封山，驿站的马一匹不少——凶手，就在你们六个人中间。",
 "而比找出凶手更重要的是：天亮之前，必须把电文的下落弄清楚。十万红军将士的会师之路，不能出任何差错。",
 "油灯还亮着。雪落无声。",
 "会宁城头的灯火，就在三十里外等着你们。"
];

DATA.rules = [
 "【本格推理】凶手在六人之中，且只有一位。动机、手法、时机，均可由线索推出。",
 "【双重目标】找出杀害老周的凶手；找回（或确认下落）绝密电文。",
 "【隐藏任务】你除了公共目标，还有自己的个人秘密任务（见随身手记）。有时候，守住秘密比破案更重要。",
 "【阵营暗线】六人之中混有一名敌方潜伏人员，代号「黄雀」。潜伏者不一定是凶手。",
 "【游戏流程】三幕推进：每幕先搜证、后讨论；第二轮搜证后有「雪夜送信」机制；终局投票指认，随后真相复盘。",
 "【单机模式】其余五名角色由剧本化AI扮演，系统担任DM（主持人）。你的每个选择都会被记住。"
];

DATA.chars = {
 huoshan:{
  name:"霍山", role:"先遣队队长", age:32, gender:"男",
  tag:"从湘江血战里爬出来的老兵，右手缺两根手指",
  pub:"你是先遣队队长，全驿站军衔最高的人。老周死后，按纪律由你临时主持局面。大家都知道你1934年从中央苏区突围，湘江一战全连只剩你和两个人，右手缺了食指和中指——所以你打枪用左手。",
  dmn:"DM（低声）：你收到了密电——队内有「黄雀」。你是今夜的主持者，也是最不能乱的人。",
  mem:[
   "老周是你过命的交情。遵义会议之后他被调到先遣队，你们搭了半年班子。",
   "今晚21点，你亲眼看见老周把电文锁进铁匣，钥匙挂在他自己脖子上。",
   "22点半，你查哨回来，在院子里碰见了马三爷，他神色慌张，说去马棚看马。你闻到他身上有酒气。",
   "23点50分左右，你听到一声闷响，不像枪声，更像有人重重摔了门。你提枪冲出屋，发现东厢房的门虚掩着，老周已经倒在炕上，胸口中弹，铁匣开着，里面空空如也。",
   "你检查了门窗：窗户从里面闩着，门没有撬痕。雪地里只有一串通向马棚又折返的脚印——是马三爷的。"
  ],
  sec:[
   "半个月前，上级密电告诉你：先遣队里可能有敌方潜伏人员，代号「黄雀」。你还没来得及排查。这个秘密不能说——打草惊蛇，黄雀就会缩回去。",
   "你知道老周脖子上的钥匙没有被拿走（你验尸时摸到了，还在他衣领里）。也就是说，开铁匣的人用的不是老周的钥匙——要么有备用钥匙，要么铁匣根本没锁。"
  ],
  tasks:[
   {id:"hs1", text:"找出凶手，找回电文"},
   {id:"hs2", text:"暗中排查「黄雀」是谁，终局指认出来"},
   {id:"hs3", text:"你是队长，不能暴露慌乱"}
  ],
  room:"枕边压着那份密电抄件。「队内有黄雀，慎查勿惊。」你把这八个字在心里过了一遍又一遍——五张脸，哪一张后面藏着黄雀？"
 },
 lin:{
  name:"林晚星", role:"宣传队队员", age:21, gender:"女",
  tag:"背着一台油印机走完长征的「笔杆子」，会唱《十送红军》",
  pub:"你是宣传队最年轻的队员，负责油印快报、写标语、教老乡识字。你的油印机是从江西一路背来的，比你的命还重。你性格开朗，驿站里谁都跟你聊得来。",
  dmn:"DM（低声）：你的蜡纸今晚被人借过。记住——重要的话，用速记符号记下来。",
  mem:[
   "今晚20点，老周找你借过油印机的蜡纸和铁笔，说「要抄个东西，急着用」。21点他还回来了，手上沾着油墨。",
   "21点半，你听见老周屋里他和沈青梧在低声争执，你只听到沈青梧说了一句：「老周，你我都是明白人，这事瞒不住的。」然后门就关上了。",
   "23点，你在自己房里刻蜡纸，刻的是明天要贴的标语：「庆祝三军会师」。你听到院子里有脚步声，很急，往马棚方向去了。你没出去看。",
   "枪响之后你第一个跑到东厢房，你注意到一个细节：桌上的油灯是灭的，但灯罩还是烫的——说明灯刚灭不久，或者是被人故意吹灭的。"
  ],
  sec:[
   "你有个习惯：重要的话你会用速记符号记在随身小本上。今晚21点半那段争执，你隔着墙速记了后半句——「……名单上有你我的名字，你信不信？」你一直没想明白「名单」是什么名单。",
   "你暗恋霍山。全队都知道，只有霍山装作不知道。这不是任务，这是你的心事。",
   "你其实会拆装机要锁。出发前机要科的同志教过你。如果铁匣锁孔有蜡纸油墨残留，你能认出来。"
  ],
  tasks:[
   {id:"ln1", text:"找出凶手"},
   {id:"ln2", text:"搞明白「名单」指的是什么，它在哪"},

(function(){
  var cv=document.getElementById("snow"), ctx=cv.getContext("2d"), flakes=[];
  function rs(){ cv.width=innerWidth; cv.height=innerHeight; }
  rs(); addEventListener("resize", rs);
  for(var i=0;i<90;i++) flakes.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    r:.6+Math.random()*1.9, v:.3+Math.random()*.9, w:Math.random()*2*Math.PI});
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle="rgba(255,255,255,.75)";
    for(var i=0;i<flakes.length;i++){ var f=flakes[i];
      f.y+=f.v; f.w+=.01; f.x+=Math.sin(f.w)*.4;
      if(f.y>cv.height+4){ f.y=-4; f.x=Math.random()*cv.width; }
      ctx.globalAlpha=.25+f.r*.28;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(tick);
  })();
})();

var AC={ // AudioCore
 ctx:null, on:false, mood:"somber", bgmLevel:.30,
 master:null, comp:null, bgmBus:null, sfxBus:null, windGain:null, droneFilter:null, melFilter:null,
 _noiseBuf:null, _schedTimer:null, _startTime:0, _scheduled:{}, _titleTimer:null,
 prefs:{bgm:true, sfx:true, vol:.9},
 PREF_KEY:"denghuo_audio_v1",

 loadPrefs:function(){ try{ var p=JSON.parse(localStorage.getItem(this.PREF_KEY)); if(p){ delete p.voice; for(var k in p) this.prefs[k]=p[k]; } }catch(e){} },
 savePrefs:function(){ try{ localStorage.setItem(this.PREF_KEY, JSON.stringify(this.prefs)); }catch(e){} },

 /* 首次用户手势解锁（浏览器自动播放策略） */
 unlock:function(){
   if(this.on){ if(this.ctx&&this.ctx.resume) try{this.ctx.resume();}catch(e){} return; }
   var Tor=(typeof window!=="undefined")&&(window.AudioContext||window.webkitAudioContext);
   if(!Tor) return;
   try{
     var c=this.ctx=new Tor();
     this.comp=c.createDynamicsCompressor(); // 压限防爆音
     this.comp.threshold.value=-16; this.comp.knee.value=18; this.comp.ratio.value=9;
     this.comp.attack.value=.003; this.comp.release.value=.25;
     this.master=c.createGain(); this.master.gain.value=this.prefs.vol;
     this.master.connect(this.comp); this.comp.connect(c.destination);
     this.bgmBus=c.createGain(); this.bgmBus.connect(this.master);
     this.sfxBus=c.createGain(); this.sfxBus.gain.value=this.prefs.sfx?1:0; this.sfxBus.connect(this.master);
     this.applyBgmGain(2);
     this.startWind(); this.startDrone(); this.startScheduler();
     if(c.resume) c.resume();
     this.on=true;
     toast("🔊 声音已开启");
     this.titleAmbience();
   }catch(e){}
 },
 applyBgmGain:function(tau){
   if(!this.bgmBus) return;
   if(this._finaleStopped) return; // 尾声 mp3 接管期间，不恢复合成 BGM 音量
   var v=this.prefs.bgm?this.bgmLevel:0;
   this.bgmBus.gain.setTargetAtTime(v, this.ctx.currentTime, tau||.2);
 },
 setMood:function(m){
   this.mood=m;
   if(this.droneFilter&&this.ctx){
     this.droneFilter.frequency.setTargetAtTime(m==="bright"?980:430, this.ctx.currentTime, 1.5);
   }
 },
 noiseBuf:function(){
   var c=this.ctx;
   if(!this._noiseBuf){
     var len=c.sampleRate*2, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
     for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
     this._noiseBuf=b;
   }
   return this._noiseBuf;
 },
 /* 环境风声层：低通噪声 + 慢 LFO 起伏 */
 startWind:function(){
   var c=this.ctx;
   var src=c.createBufferSource(); src.buffer=this.noiseBuf(); src.loop=true;
   var f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=360; f.Q.value=.7;
   this.windGain=c.createGain(); this.windGain.gain.value=0;
   var lfo=c.createOscillator(); lfo.frequency.value=.11;
   var lg=c.createGain(); lg.gain.value=.045;
   lfo.connect(lg); lg.connect(this.windGain.gain);
   src.connect(f); f.connect(this.windGain); this.windGain.connect(this.master);
   src.start(); lfo.start();
   this.windGain.gain.setTargetAtTime(.11, c.currentTime, 2.5);
 },
 /* BGM 低音 drone：锯齿波×2（D2/A2 微失谐）+ 正弦 D3，低通 + 慢 LFO，弦乐 pad 感 */
 startDrone:function(){
   var c=this.ctx;
   var f=this.droneFilter=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=430; f.Q.value=1.4;
   var lfo=c.createOscillator(); lfo.frequency.value=.055;
   var lg=c.createGain(); lg.gain.value=110;
   lfo.connect(lg); lg.connect(f.frequency); lfo.start();
   var g=c.createGain(); g.gain.value=0; g.gain.setTargetAtTime(.9, c.currentTime, 3);
   var parts=[["sawtooth",NOTES.D2,0,.5],["sawtooth",NOTES.A2,5,.32],["sine",NOTES.D3,-4,.28]];
   for(var i=0;i<parts.length;i++){
     var o=c.createOscillator(); o.type=parts[i][0]; o.frequency.value=parts[i][1]; o.detune.value=parts[i][2];
     var og=c.createGain(); og.gain.value=parts[i][3];
     o.connect(og); og.connect(f); o.start();
   }
   f.connect(g); g.connect(this.bgmBus);
   this.melFilter=c.createBiquadFilter(); this.melFilter.type="lowpass"; this.melFilter.frequency.value=2200;
   this.melFilter.connect(this.bgmBus);
 },
 /* 单音：三角波主体 + 高八度正弦（彩蛋变体更亮），慢起音包络 */
 note:function(freq,t,dur,gain,bright){
   var c=this.ctx;
   var o1=c.createOscillator(); o1.type="triangle"; o1.frequency.value=freq;
   var o2=c.createOscillator(); o2.type="sine"; o2.frequency.value=freq*2;
   var vib=c.createOscillator(); vib.frequency.value=4.5;
   var vg=c.createGain(); vg.gain.value=freq*.004;
   vib.connect(vg); vg.connect(o1.frequency);
   var g=c.createGain();
   g.gain.setValueAtTime(.0001,t);
   g.gain.exponentialRampToValueAtTime(gain,t+.8);
   g.gain.setValueAtTime(gain*.85,t+dur*.55);
   g.gain.exponentialRampToValueAtTime(.0001,t+dur);
   var g2=c.createGain(); g2.gain.value=bright?.30:.10;
   o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.melFilter);
   o1.start(t); o2.start(t); vib.start(t);
   o1.stop(t+dur+.1); o2.stop(t+dur+.1); vib.stop(t+dur+.1);
 },
 /* 前瞻调度器：每 250ms 检查循环窗口，事件按 cycle:i 去重 → 48s 无缝循环 */
 startScheduler:function(){
   var self=this; this._startTime=this.ctx.currentTime+.15; this._scheduled={};
   this._schedTimer=setInterval(function(){ self.schedTick(); },250);
   this.schedTick();
 },
 schedTick:function(){
   if(!this.ctx) return;
   var rel=this.ctx.currentTime-this._startTime;
   if(rel<0) return;
   var cyc=Math.floor(rel/BGM_LOOP), pos=rel-cyc*BGM_LOOP;
   var mel=this.mood==="bright"?BGM_BRIGHT:BGM_SOMBER;
   for(var i=0;i<mel.length;i++){
     var ev=mel[i], key=cyc+":"+i;
     if(ev[0]>=pos-.01 && ev[0]<pos+.30 && !this._scheduled[key]){
       this._scheduled[key]=1;
       this.note(NOTES[ev[1]], this._startTime+cyc*BGM_LOOP+ev[0], ev[2], ev[3], this.mood==="bright");
     }
   }
 },
 /* 标题页氛围：随机间隔的灯芯噼啪 */
 titleAmbience:function(){
   var self=this;
   if(this._titleTimer){ clearTimeout(this._titleTimer); this._titleTimer=null; }
   if(!this.on || !S || S.scene!=="title") return;
   (function tick(){
     if(!S||S.scene!=="title"||!self.on) return;
     self.sfx.crackle(2+Math.floor(Math.random()*3));
     self._titleTimer=setTimeout(tick, 1800+Math.random()*2600);
   })();
 },
 ok2:function(){ return this.on && this.prefs.sfx && this.ctx; }
};

/* ---------- 互动音效：每个独立合成函数，便于调参 ---------- */
AC.sfx={
 /* 纸张展开：带通噪声快速上扫 */
 paper:function(){ if(!AC.ok2())return; var c=AC.ctx,t=c.currentTime;
   var n=c.createBufferSource(); n.buffer=AC.noiseBuf();
   var f=c.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.3;
   f.frequency.setValueAtTime(800,t); f.frequency.exponentialRampToValueAtTime(4600,t+.2);
   var g=c.createGain(); g.gain.setValueAtTime(.0001,t);
   g.gain.exponentialRampToValueAtTime(.24,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+.3);
   n.connect(f); f.connect(g); g.connect(AC.sfxBus); n.start(t); n.stop(t+.35);
 },
 /* 木门吱呀：锯齿波下滑 + 频率抖动 */
 door:function(){ if(!AC.ok2())return; var c=AC.ctx,t=c.currentTime;
   var o=c.createOscillator(); o.type="sawtooth";
   o.frequency.setValueAtTime(170,t); o.frequency.exponentialRampToValueAtTime(85,t+.65);
   var lfo=c.createOscillator(); lfo.frequency.value=11;
   var lg=c.createGain(); lg.gain.value=26; lfo.connect(lg); lg.connect(o.frequency);
   var f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=520; f.Q.value=3.5;
   var g=c.createGain(); g.gain.setValueAtTime(.0001,t);
   g.gain.exponentialRampToValueAtTime(.16,t+.09);
   g.gain.setValueAtTime(.13,t+.4); g.gain.exponentialRampToValueAtTime(.0001,t+.72);
   o.connect(f); f.connect(g); g.connect(AC.sfxBus);
   o.start(t); lfo.start(t); o.stop(t+.78); lfo.stop(t+.78);
 },
 /* 翻箱倒柜：数次低通噪声闷击 */
 rummage:function(){ if(!AC.ok2())return; var c=AC.ctx,t0=c.currentTime;
   for(var i=0;i<4;i++){ var t=t0+i*(.11+Math.random()*.05);
     var n=c.createBufferSource(); n.buffer=AC.noiseBuf();
     var f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=480+Math.random()*800;
     var g=c.createGain(); g.gain.setValueAtTime(.0001,t);
     g.gain.exponentialRampToValueAtTime(.14+Math.random()*.1,t+.015);
     g.gain.exponentialRampToValueAtTime(.0001,t+.08+Math.random()*.05);
     n.connect(f); f.connect(g); g.connect(AC.sfxBus); n.start(t); n.stop(t+.16);
   }
 },
 /* 雪地脚步：嘎吱碎裂声 ×n */
 steps:function(n){ if(!AC.ok2())return; var c=AC.ctx,t0=c.currentTime; n=n||2;
   for(var i=0;i<n;i++){ var t=t0+i*.36;
     var src=c.createBufferSource(); src.buffer=AC.noiseBuf();
     var f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=300+Math.random()*120; f.Q.value=1.8;
     var g=c.createGain(); g.gain.setValueAtTime(.0001,t);
     g.gain.exponentialRampToValueAtTime(.26,t+.02);
     g.gain.exponentialRampToValueAtTime(.05,t+.09);
     g.gain.exponentialRampToValueAtTime(.0001,t+.15);
     src.connect(f); f.connect(g); g.connect(AC.sfxBus); src.start(t); src.stop(t+.2);
   }
 },
 /* 灯芯噼啪：极短高频爆点 */
 crackle:function(n){ if(!AC.ok2())return; var c=AC.ctx,t0=c.currentTime; n=n||4;
   for(var i=0;i<n;i++){ var t=t0+Math.random()*.55;
     var src=c.createBufferSource(); src.buffer=AC.noiseBuf();
     var f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=2600+Math.random()*1500;
     var g=c.createGain(); g.gain.setValueAtTime(.0001,t);
     g.gain.exponentialRampToValueAtTime(.05+Math.random()*.08,t+.004);
     g.gain.exponentialRampToValueAtTime(.0001,t+.02+Math.random()*.02);
     src.connect(f); f.connect(g); g.connect(AC.sfxBus); src.start(t); src.stop(t+.06);
   }
 },
 /* 低沉枪声：正弦骤降 + 低通噪声轰击 */
 gun:function(){ if(!AC.ok2())return; var c=AC.ctx,t=c.currentTime;
   var o=c.createOscillator(); o.type="sine";
   o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(42,t+.35);
   var g=c.createGain(); g.gain.setValueAtTime(.0001,t);
   g.gain.exponentialRampToValueAtTime(.55,t+.008);
   g.gain.exponentialRampToValueAtTime(.0001,t+.5);
   o.connect(g); g.connect(AC.sfxBus); o.start(t); o.stop(t+.55);
   var n=c.createBufferSource(); n.buffer=AC.noiseBuf();
   var f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=750;
   var g2=c.createGain(); g2.gain.setValueAtTime(.0001,t);
   g2.gain.exponentialRampToValueAtTime(.38,t+.006);
   g2.gain.exponentialRampToValueAtTime(.0001,t+.28);
   n.connect(f); f.connect(g2); g2.connect(AC.sfxBus); n.start(t); n.stop(t+.32);
 },
 /* 翻页/落座：短纸声 + 低频轻顿（NPC发言时） */
 page:function(){ if(!AC.ok2())return; var c=AC.ctx,t=c.currentTime;
   var n=c.createBufferSource(); n.buffer=AC.noiseBuf();
   var f=c.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.2;
   f.frequency.setValueAtTime(1200,t); f.frequency.exponentialRampToValueAtTime(3000,t+.12);
   var g=c.createGain(); g.gain.setValueAtTime(.0001,t);
   g.gain.exponentialRampToValueAtTime(.09,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.16);
   n.connect(f); f.connect(g); g.connect(AC.sfxBus); n.start(t); n.stop(t+.2);
   var o=c.createOscillator(); o.type="sine"; o.frequency.value=95;
   var g2=c.createGain(); g2.gain.setValueAtTime(.0001,t+.05);
   g2.gain.exponentialRampToValueAtTime(.13,t+.065); g2.gain.exponentialRampToValueAtTime(.0001,t+.2);
   o.connect(g2); g2.connect(AC.sfxBus); o.start(t+.05); o.stop(t+.25);
 }
};



/* =====================================================================
   尾声 BGM：内嵌 mp3（HTMLAudioElement），彩蛋页与合成 BGM 做 X 型交叉淡入淡出
   ===================================================================== */
var Finale={
 audio:null, active:false, fading:false, _fadeTimer:null, FADE_MS:3000,
 ensure:function(){
   if(this.audio || typeof Audio==="undefined") return this.audio;
   try{
     var a=new Audio();
     a.loop=true; a.preload="auto"; a.volume=0;
     a.src=FINALE_BGM_SRC;
     this.audio=a;
   }catch(e){ this.audio=null; }
   return this.audio;
 },
 /* 与 bgmBus 等效的目标音量：bgmLevel × 主音量；BGM 开关关闭时为 0 */
 targetVol:function(){ return (AC.prefs.bgm?AC.bgmLevel:0)*AC.prefs.vol; },
 /* 主音量滑块 / BGM 开关变化时同步 mp3 音量（淡入淡出期间不打断） */
 syncVol:function(){
   if(!this.audio || this.fading) return;
   try{ this.audio.volume=this.targetVol(); }catch(e){}
 },
 /* 彩蛋页进入：合成BGM 3s 线性渐弱到 0 并停调度器；mp3 同时从 0 线性淡入（X 型 crossfade，无静默、不叠响） */
 crossfade:function(){
   if(typeof Audio==="undefined") return; // 无头/不支持环境静默兜底
   var a=this.ensure(); if(!a) return;
   var self=this;
   try{ // 合成 BGM 渐弱 + 停止旋律调度（drone/旋律经 bgmBus 归零淡出）
     if(AC.on && AC.ctx && AC.bgmBus){
       var t=AC.ctx.currentTime;
       AC.bgmBus.gain.cancelScheduledValues(t);
       AC.bgmBus.gain.setValueAtTime(AC.bgmBus.gain.value,t);
       AC.bgmBus.gain.linearRampToValueAtTime(0,t+this.FADE_MS/1000);
       if(AC._schedTimer){ clearInterval(AC._schedTimer); AC._schedTimer=null; }
       AC._finaleStopped=true;
     }
   }catch(e){}
   try{ // mp3 从头循环播放，音量交给淡入曲线（未解锁自动播放时 play() 拒绝，静默兜底）
     a.loop=true; a.currentTime=0; a.volume=0;
     var p=a.play(); if(p&&p.catch) p.catch(function(){});
   }catch(e){}
   this.active=true; this.fading=true;
   if(this._fadeTimer){ clearInterval(this._fadeTimer); this._fadeTimer=null; }
   var start=Date.now(), dur=this.FADE_MS, to=this.targetVol();
   this._fadeTimer=setInterval(function(){
     var k=(Date.now()-start)/dur; if(k>1) k=1;
     try{ a.volume=to*k; }catch(e){}
     if(k>=1){ clearInterval(self._fadeTimer); self._fadeTimer=null; self.fading=false; self.syncVol(); }
   },50);
 },
 /* 离开彩蛋/回标题/重新开始：mp3 停止复位，合成 BGM 恢复，重进彩蛋可再次 crossfade */
 stop:function(){
   this.active=false; this.fading=false;
   if(this._fadeTimer){ clearInterval(this._fadeTimer); this._fadeTimer=null; }
   if(this.audio){ try{ this.audio.pause(); this.audio.currentTime=0; this.audio.volume=0; }catch(e){} }
   try{
     if(AC.on && AC.ctx && AC._finaleStopped){
       AC._finaleStopped=false;
       AC.applyBgmGain(1.5); // 合成 BGM 平滑回淡到 bgmLevel
       AC.startScheduler();  // 重启 48s 循环旋律调度
     }
   }catch(e){}
 }
};

/* ---------- 打字机 ---------- */
var TYPE_MS=34; // 打字节奏（毫秒/字，可调）
var Typer={timer:null,skipAll:false,
 run:function(el, paras, done){
   var pi=0, ci=0, self=this; this.skipAll=false;
   el.innerHTML="";
   var cur=null;
   function newP(){ cur=document.createElement("p"); el.appendChild(cur); }
   function step(){
     if(self.skipAll){
       el.innerHTML=paras.map(function(p){return "<p>"+esc(p)+"</p>";}).join("");
       cleanup(); done&&done(); return;
     }
     if(pi>=paras.length){ cleanup(); done&&done(); return; }
     if(ci===0) newP();
     cur.textContent=paras[pi].slice(0,++ci);
     cur.classList.add("cursor");
     if(ci>=paras[pi].length){ cur.classList.remove("cursor"); pi++; ci=0; }
     self.timer=setTimeout(step, pi===0&&ci===1?300:TYPE_MS);
   }
   function cleanup(){ if(self.timer){clearTimeout(self.timer); self.timer=null;} }
   step();
   this.abort=function(){ self.skipAll=true; if(self.timer){clearTimeout(self.timer);} step(); };
 }
};

 },

var SEARCH={scene:null};
function rSearch(app){
  var R=DATA.rounds[S.round-1];
  var total=0, found=0;
  Object.keys(R.scenes).forEach(function(k){ var sc=R.scenes[k];
    (sc.spots||[]).forEach(function(sp){ if(sp.clue){ total++; if(hasClue(sp.clue)) found++; } });
    if(sc.roomSpots) Object.keys(sc.roomSpots).forEach(function(rk){
      sc.roomSpots[rk].forEach(function(sp){ if(sp.clue){ total++; if(hasClue(sp.clue)) found++; } });
    });
  });
  var mapSvg=
   '<svg viewBox="0 0 360 260" style="width:100%;display:block">'+
   '<rect x="0" y="0" width="360" height="260" fill="#0d1730"/>'+
   '<rect x="14" y="10" width="332" height="20" class="hot" data-sc="back" id="sc-back"/><text x="180" y="24" text-anchor="middle" font-size="11">后院墙 · 老君庙方向</text>'+
   '<rect x="238" y="46" width="106" height="72" class="hot" data-sc="east" id="sc-east"/><text x="291" y="86" text-anchor="middle" font-size="13">东厢房</text>'+
   '<rect x="122" y="50" width="104" height="64" class="hot" data-sc="yard" id="sc-yard"/><text x="174" y="86" text-anchor="middle" font-size="12">院子·雪地</text>'+
   '<rect x="16" y="46" width="94" height="108" class="hot" data-sc="rooms" id="sc-rooms"/><text x="63" y="96" text-anchor="middle" font-size="12">住屋排</text><text x="63" y="112" text-anchor="middle" font-size="9" fill="#c9b998">各人房间</text>'+
   '<rect x="238" y="164" width="106" height="58" class="hot" data-sc="stable" id="sc-stable"/><text x="291" y="197" text-anchor="middle" font-size="12">马棚</text>'+
   '<rect x="136" y="164" width="86" height="50" class="hot" data-sc="kitchen" id="sc-kitchen"/><text x="179" y="193" text-anchor="middle" font-size="12">厨房</text>'+
   '<circle cx="70" cy="196" r="22" class="hot" data-sc="well" id="sc-well"/><text x="70" y="200" text-anchor="middle" font-size="11">水井</text>'+
   '</svg>';
  app.innerHTML='<div class="screen"><h2 class="center lampc">'+R.name+'</h2>'+
   '<p class="center dim small">'+esc(R.sub)+' · 已获线索 '+found+' / '+total+'</p>'+
   '<div class="map-box">'+mapSvg+'</div>'+
   '<div id="scenepanel" style="margin-top:14px"><p class="center dim">点击驿站地图上的区域，开始搜查。</p></div>'+
   '<button class="btn" id="discussBtn" onclick="tryFinishSearch()">'+
   (found>=total?'结束搜证，进入讨论 →':'结束搜证（还有 '+(total-found)+' 条线索未找到）')+'</button></div>';
  // 高亮含未获取线索的区域
  Object.keys(R.scenes).forEach(function(k){
    var sc=R.scenes[k], pending=false;
    (sc.spots||[]).forEach(function(sp){ if(sp.clue&&!hasClue(sp.clue)) pending=true; });
    if(sc.roomSpots) Object.keys(sc.roomSpots).forEach(function(rk){
      sc.roomSpots[rk].forEach(function(sp){ if(sp.clue&&!hasClue(sp.clue)) pending=true; }); });
    var el=document.getElementById("sc-"+k);
    if(el){ el.classList.add(pending?"glow":"done");
      el.addEventListener("click",function(){ openScene(k); }); }
  });
}
function openScene(k){
  if(AC.on){ AC.sfx.door(); if(k==="yard"||k==="back") AC.sfx.steps(2); } // 推门 + 雪地脚步
  var R=DATA.rounds[S.round-1], sc=R.scenes[k], p=document.getElementById("scenepanel");
  var h='<div class="narr"><span class="dm-tag">'+esc(sc.name)+'</span>';
  (sc.spots||[]).forEach(function(sp,i){
    if(sp.clue){ var got=hasClue(sp.clue);
      h+='<button class="spot-btn" '+(got?'disabled':'onclick="getClue(\''+k+'\','+i+')"')+'>'+esc(sp.label)+(got?'<span class="got">✓ 已取证</span>':'')+'</button>';
    } else h+='<p class="dim small" style="margin:8px 0">'+esc(sp.flavor)+'</p>';
  });
  h+='</div>';
  if(sc.rooms){
    h+='<div class="narr"><span class="dm-tag">住屋排 · 各人的房间</span>';
    ORDER.forEach(function(cid){
      if(cid===S.player){
        var mySpots=(sc.roomSpots&&sc.roomSpots[cid])||[];
        var myDone=mySpots.length>0&&mySpots.every(function(sp){return !sp.clue||hasClue(sp.clue);});
        h+='<button class="spot-btn" onclick="openMyRoom()">你的房间（'+cname(cid)+'的房间）'+(myDone?'<span class="got">✓ 已搜查</span>':'')+'</button>';
      } else {
        var spots=(sc.roomSpots&&sc.roomSpots[cid])||[];
        var allGot=spots.length&&spots.every(function(sp){return !sp.clue||hasClue(sp.clue);});
        var none=spots.length===0;
        h+='<button class="spot-btn" '+((none||allGot)?'disabled':'onclick="openRoom(\''+cid+'\')"')+'>'+cname(cid)+'的房间'+
          (none?'<span class="got">今夜不便打扰</span>':(allGot?'<span class="got">✓ 已搜查</span>':''))+'</button>';
      }
    });
    h+='</div>';
  }
  p.innerHTML=h;
}
function openMyRoom(){
  if(AC.on) AC.sfx.door();
  var sc=DATA.rounds[S.round-1].scenes.rooms;
  var spots=(sc&&sc.roomSpots&&sc.roomSpots[S.player])||[];
  var h='<div class="narr"><span class="dm-tag">你的房间</span><p class="mono">'+esc(me().room)+'</p>';
  spots.forEach(function(sp,i){

      h+='<button class="spot-btn" '+(got?'disabled':'onclick="getRoomClue(\''+S.player+'\','+i+')"')+'>'+esc(sp.label)+(got?'<span class="got">✓ 已取证</span>':'')+'</button>';
    }
  });
  h+='</div>';
  document.getElementById("scenepanel").innerHTML=h;
}

function getClue(scKey, idx){ gainClue(DATA.rounds[S.round-1].scenes[scKey].spots[idx].clue, false); }

/* 在自己房间翻出线索时的内心独白（玩家身份与线索分配解耦时的文案补偿） */
var OWN_NOTES={
 B7:"你亲手从枕下取出那封密电抄件，八个字又看了一遍：「队内有黄雀，慎查勿惊。」……事到如今，得让大家也看见了。",

 B5:"你从枕边摸出那枚铜纽扣。背面那个「黄」字在灯下泛着冷光——这东西，你本想再藏一藏的。",
 C1:"你打开自己药箱的夹层，盘库单上的字刺眼：马钱子碱，三日前在库，今晨缺失。你决定，不再瞒了。",

function gainClue(id, ownRoom){
  if(AC.on){ AC.sfx.rummage(); setTimeout(function(){ AC.sfx.paper(); },420); } // 翻找→纸张展开
  var c=DATA.clues[id];
  var app=document.getElementById("app");
  var hideBtn="";
  if(S.round===2 && S.hidden.length<1){
    hideBtn='<button class="btn red-btn" onclick="keepClue(\''+id+'\')">🤫 私藏这张线索（本轮限1张，只有你知道）</button>';
  }
  var ownNote=(ownRoom&&OWN_NOTES[id])?'<p class="mono" style="margin-top:10px">'+esc(OWN_NOTES[id])+'</p>':'';
  var div=document.createElement("div");
  div.innerHTML='<div class="screen"><div class="clue-card"><div class="cid">线索 '+id+'</div>'+
   '<div class="ct">'+esc(c.t)+'</div><div class="cx">'+esc(c.x)+'</div>'+ownNote+'</div>'+hideBtn+
   '<button class="btn" onclick="pubClue(\''+id+'\')">📣 公开宣读，收入证据袋</button></div>';
  app.innerHTML=div.innerHTML;
}
function pubClue(id){ if(!hasClue(id)) S.clues.push(id); save(); rSearch(document.getElementById("app")); }
function keepClue(id){ if(!hasClue(id)){S.clues.push(id);} if(S.hidden.indexOf(id)<0) S.hidden.push(id); save(); rSearch(document.getElementById("app")); }

function nextAfterSearch(){
  if(S.round===2 && !S.letterDone){ go("letter"); return; }
  go("discuss");
}
/* 兜底：即使线索没收齐，确认后也可强制进入讨论，防止流程卡死 */
function roundClueStat(){
  var R=DATA.rounds[S.round-1], total=0, found=0;
  Object.keys(R.scenes).forEach(function(k){ var sc=R.scenes[k];
    (sc.spots||[]).forEach(function(sp){ if(sp.clue){ total++; if(hasClue(sp.clue)) found++; } });
    if(sc.roomSpots) Object.keys(sc.roomSpots).forEach(function(rk){
      sc.roomSpots[rk].forEach(function(sp){ if(sp.clue){ total++; if(hasClue(sp.clue)) found++; } });
    });
  });
  return {total:total, found:found};
}
function tryFinishSearch(){
  var st=roundClueStat(), miss=st.total-st.found;
  if(miss>0 && typeof confirm==="function"){
    if(!confirm("还有 "+miss+" 条线索未找到，确定提前结束搜证？\n（未找到的线索不会进入证据袋，可在复盘时听 DM 公布）")) return;
  }
  nextAfterSearch();
}

  var any=false;
  keys.forEach(function(id){ if(hasClue(id)){ any=true;
    h+='<div class="clue-mini"><b class="lampc">['+id+']</b> '+esc(DATA.clues[id].t)+'<br><span class="dim small">'+esc(DATA.clues[id].x)+'</span></div>'; }});
  if(!any) h+='<p class="dim">关键线索尚未收集到。</p>';
  h+='<button class="btn ghost" onclick="UI.close()">收起</button>';
  this.open(h);
};
function submitVote(){
  S.settle=computeSettle(); S.revealIdx=0; save(); go("reveal");
}

/* ---------- 9. 真相复盘（四层） ---------- */
function rReveal(app){
  var i=S.revealIdx, R=DATA.reveals[i], mc=DATA.chars[R.mono.who];
  if(AC.on && i===1) setTimeout(function(){ AC.sfx.gun(); },700); // 第二层「枪」：低沉枪声
  app.innerHTML='<div class="screen"><div class="reveal-title">'+esc(R.title)+'</div>'+
   '<div class="reveal-sub">—— '+esc(R.sub)+' ——</div>'+
   R.dm.map(function(t){return '<div class="narr"><p>'+esc(t)+'</p></div>';}).join("")+
   '<div class="say"><div class="who">'+mc.name+' 的独白<span class="wrole">'+mc.role+'</span></div><div class="mono">'+esc(R.mono.text)+'</div></div>'+
   '<button class="btn" onclick="nextReveal()">'+(i<3?'揭开下一层真相 →':'查看任务结算 →')+'</button></div>';
}
function nextReveal(){
  if(S.revealIdx<3){ S.revealIdx++; save(); go("reveal"); }
  else go("settle");
}

/* ---------- 10. 结算（按所选角色判定个人任务） ---------- */
function computeSettle(){
  var v=S.votes, p=S.player;
  var killerOK = v.q1==="ma";
  var selfOK = v.q3==="self";
  var waxOK = v.q2==="wax";
  var publicWin = killerOK && selfOK;
  var t={};
  if(p==="huoshan"){
    t.hs1={done:killerOK&&waxOK, note:killerOK&&waxOK?"凶手伏法，电文完璧。":"凶手或电文，你漏了一项。"};
    t.hs2={done:killerOK, note:killerOK?"你当众点出黄雀是马三爷——密电的交代，完成了。":"黄雀从你身边溜走了。"};
    t.hs3={done:true, note:"从头到尾，你坐得很稳。没人看见你攥紧的左手。"};
  }else if(p==="lin"){
    t.ln1={done:killerOK, note:killerOK?"你指认了真凶。":"真凶未能伏法。"};
    t.ln2={done:waxOK, note:waxOK?"名单就在你的蜡纸筒里——你终于读懂了那句速记。":"名单的下落，成了永远的谜。"};
    t.ln3={done:waxOK||killerOK, note:"真相大白：蜡纸拓钥是老周本人所为，宣传队的声誉保住了。"};
  }else if(p==="qin"){
    t.qn1={done:selfOK, note:selfOK?"你查明了：毒是自己服的，枪是死后补的。":"老周真正的死因，你没有说对。"};
    t.qn2={done:waxOK, note:waxOK?"蜡纸筒里的名单有你的单线记录——你的身份，有人能证明了。":"没有找到自证身份的东西，天亮后……但愿接应的人肯听你解释。"};
    t.qn3={done:killerOK, note:killerOK?"偷马钱子碱的是马三爷——你的药箱清白了。":"偷药的人没能确定。"};
  }else if(p==="shi"){
    t.sg1={done:killerOK, note:killerOK?"信号是黄雀发的，黄雀就是马三爷。":"信号之谜没能完全解开。"};
    t.sg2={done:true, note:"你守住了秘密到复盘。而遗书的背面写着：弟弟系假降，已归队。你可以哭了。"};
    t.sg3={done:selfOK, note:selfOK?"掌印之谜解开——那是你自己抖得扶不稳的手。":"掌印的事，你始终没有声张。"};
  }else if(p==="ma"){
    t.ma1={done:!killerOK, note:!killerOK?"没有人指认你。你混过去了——但你一辈子都要带着这块补丁活。":"你被当众指认为黄雀。一切结束了。"};
    t.ma2={done:letterEagle(), note:letterEagle()?"你把「鹰嘴崖」送了出去。十万人改道了。你弟弟……你对不起他，也对得起自己了。":"那句警告，你终究没有送出去。鹰嘴崖的雪，会记住这一夜。"};
    t.ma3={done:!killerOK, note:!killerOK?"井边的事被当成了悬案。你的谎圆住了。":"铁盒、钉鞋、齿痕大洋——证据链把你钉死了。"};
  }else if(p==="shen"){
    t.sh1={done:waxOK||v.q2==="gone", note:waxOK?"正件找到了——蜡纸筒标语背面，从未落入敌手。":(v.q2==="gone"?"你判断电文已被销毁：只要不在黄雀手里，就算赢。其实它在蜡纸筒里，同样安全。":"电文的下落，你没能确认。")};
    t.sh2={done:killerOK, note:killerOK?"你当众指认了黄雀：袖口补丁、齿痕大洋、钉鞋印——西北的地下网保住了。":"黄雀没有伏法，副件名单从此悬在刀尖上。"};
    t.sh3={done:true, note:"采访本和皮箱夹层，都没有落到外人手里。"};
  }
  var tasks=me().tasks.map(function(x){ return {id:x.id, text:x.text, done:t[x.id].done, note:t[x.id].note}; });
  var letterNote;
  if(letterEagle()) letterNote="你的密信「"+S.letter+"」——接应部队收到警告：鹰嘴崖有埋伏，会师路线已改道。十万将士，绕开了绝地。";
  else if(letterFake()) letterNote="你的密信「"+S.letter+"」被复盘记录为【假情报已送出】——这是黄雀最想看到的结果。";
  else if(letterKey()) letterNote="你的密信「"+S.letter+"」——接应部队收到关键信息，名单中转有了着落。";
  else letterNote="你的密信「"+S.letter+"」平安送达。它没有改变战局，但也没有带来灾祸。";
  return {tasks:tasks, publicWin:publicWin, killerOK:killerOK, selfOK:selfOK, waxOK:waxOK, letterNote:letterNote};
}
function rSettle(app){
  var z=S.settle;
  var h='<div class="screen"><h2 class="center lampc">结 算</h2>';
  h+='<div class="result-banner'+(z.publicWin?'':' bad')+'"><div class="dim small">公共目标</div>'+
     '<div class="big '+(z.publicWin?'lampc':'red')+'">'+(z.publicWin?'公 共 胜 利':'公 共 失 利')+'</div>'+
     '<div class="small dim">指认马三爷为真凶'+(z.killerOK?' ✓':' ✗')+' · 理解老周系自行服毒'+(z.selfOK?' ✓':' ✗')+'</div>'+
     '<div class="small dim">电文下落：'+(z.waxOK?'答对了——蜡纸筒标语背面 ✓':'未能答出「蜡纸筒标语背面」 ✗')+'</div></div>';
  h+='<h3 class="lampc">你的个人任务 · '+me().name+'</h3>';
  z.tasks.forEach(function(t){
    h+='<div class="task-item"><span class="tick">'+(t.done?'✅':'❌')+'</span><b>'+esc(t.text)+'</b><br><span class="dim small">'+esc(t.note)+'</span></div>';
  });
  h+='<div class="narr"><span class="dm-tag">雪夜送信 · 复盘</span><p>'+esc(z.letterNote)+'</p></div>';
  h+='<button class="btn" onclick="go(\'egg\')">雪，快停了 →</button></div>';
  app.innerHTML=h;
}

/* ---------- 11. 红色彩蛋（四拍节奏：灯亮 → 静 → 文字浮现 → 结语定格） ---------- */
var EGG={timers:[], done:false};
function eggLater(fn,ms){ EGG.timers.push(setTimeout(fn,ms)); }
function eggSkip(){ // 点击画面跳过等待：清掉排队定时器，灯全亮、文字与按钮直接就位
  if(EGG.done) return; EGG.done=true;
  EGG.timers.forEach(function(t){ clearTimeout(t); }); EGG.timers=[];
  if(typeof Finale!=="undefined" && !Finale.active){ try{ Finale.crossfade(); }catch(e){} } // 跳过时补响尾声曲
  for(var k=0;k<7;k++){ var e=document.getElementById("el"+k); if(e) e.classList.add("lit"); }
  DATA.egg.lines.forEach(function(_,k){ var e=document.getElementById("eg"+k); if(e) e.classList.add("show"); });
  var f=document.getElementById("egf"); if(f) f.classList.add("show");
  var b=document.getElementById("eggbtn"); if(b){ b.style.opacity=1; b.style.pointerEvents="auto"; }
  var tip=document.getElementById("eggtip"); if(tip) tip.style.display="none";
}
function rEgg(app){
  hud(false);
  AC.setMood("bright"); // 彩蛋页切换为明亮 BGM 变体
  EGG.timers=[]; EGG.done=false; // 重进彩蛋可再次完整播放
  eggLater(function(){ Finale.crossfade(); },600); // 与第一盏灯同步：mp3 淡入、合成BGM 渐弱（X 型 crossfade）
  var lamps=""; for(var i=0;i<7;i++) lamps+='<div class="egg-lamp" id="el'+i+'"></div>';
  app.innerHTML='<div class="screen" onclick="eggSkip()"><h2 class="center lampc" style="letter-spacing:.4em">尾 声</h2>'+
   '<div id="egg-lamps">'+lamps+'</div><div id="eggtext" style="max-width:520px;margin:0 auto">'+
   DATA.egg.lines.map(function(t,i){return '<p class="egg-line" id="eg'+i+'">'+esc(t)+'</p>';}).join("")+
   '<p class="egg-line egg-final" id="egf">'+esc(DATA.egg.final)+'</p></div>'+
   '<div id="eggbtn" class="center" style="margin-top:30px;opacity:0;pointer-events:none;transition:opacity 1.5s">'+
   '<button class="btn" onclick="Finale.stop();clearSave();S=fresh();go(\'title\')">再入一夜风雪（重新开始）</button></div>'+
   '<div class="skiptip" id="eggtip">点击画面可跳过等待</div></div>';
  var i;
  /* 第一拍·点灯：600ms 起每 700ms 一盏（保留 crackle），4800ms 全部亮起，此阶段无任何正文 */
  for(i=0;i<7;i++){ (function(k){ eggLater(function(){ var e=document.getElementById("el"+k); if(e){ e.classList.add("lit"); if(AC.on) AC.sfx.crackle(3); } }, 600+k*700); })(i); }
  /* 第二拍·留白：全亮后静 1.8s，只听 BGM */
  var T0=4800+1800; // 6600ms 起文字开始浮现
  /* 第三拍·历史段落缓缓浮现：每条间隔 1.4s，CSS 2.4s 淡入+8px 上移 */
  DATA.egg.lines.forEach(function(line,k){ eggLater(function(){ var e=document.getElementById("eg"+k); if(e) e.classList.add("show"); }, T0+k*1400); });
  /* 第四拍·结语单独再延迟 2s 浮现并定格，结语落定后按钮才淡入 */
  var tFinal=T0+(DATA.egg.lines.length-1)*1400+2000; // 15600ms
  eggLater(function(){ var e=document.getElementById("egf"); if(e) e.classList.add("show"); }, tFinal);
  eggLater(function(){ var e=document.getElementById("eggbtn"); if(e){ e.style.opacity=1; e.style.pointerEvents="auto"; } var t2=document.getElementById("eggtip"); if(t2) t2.style.display="none"; EGG.done=true; }, tFinal+2600);
  clearSave();
}

/* ---------- 启动 ---------- */
S=fresh();
if(hasSave()){ /* 标题页会出现「继续」按钮 */ }
render();
</script>
